<div id="stscdev_manager_overlay" class="stscdev-overlay stscdev-hidden" aria-hidden="true">

    <div class="stscdev-manager-header">
      <div class="stscdev-manager-heading">
        <div class="stscdev-manager-title">墨提斯之镜 · DEV <button id="stscdev_version_button" class="stscdev-manager-version" type="button" title="查看版本信息">v0.4.0-beta.14<span class="stscdev-header-dot" aria-hidden="true"></span></button></div>
        <div id="stscdev_manager_subtitle" class="stscdev-manager-subtitle"></div>
      </div>
      <div class="stscdev-header-actions">
        <button id="stscdev_log_button" class="menu_button stscdev-header-log-button" type="button">运行日志<span class="stscdev-header-dot" aria-hidden="true"></span></button>
        <span id="stscdev_save_state" class="stscdev-save-state">已保存</span>
        <button id="stscdev_save_changes" class="menu_button stscdev-save-button" type="button" disabled>保存更改</button>

      </div>
    </div>

    <div class="stscdev-tabs" role="tablist" aria-label="墨提斯之镜 DEV 功能页">
      <button class="stscdev-tab active" type="button" data-tab="status">当前状态</button>
      <button class="stscdev-tab" type="button" data-tab="presets">自检预设</button>
      <button class="stscdev-tab" type="button" data-tab="references">参考资料库</button>
      <button class="stscdev-tab" type="button" data-tab="temporary">快捷指令</button>
      <button class="stscdev-tab" type="button" data-tab="settings">插件设置</button>
      <button class="stscdev-tab" type="button" data-tab="appearance">界面显示</button>
    </div>

    <div class="stscdev-manager-body">
      <section id="stscdev_tab_status" class="stscdev-tab-panel active"></section>
      <section id="stscdev_tab_presets" class="stscdev-tab-panel"></section>
      <section id="stscdev_tab_references" class="stscdev-tab-panel"></section>
      <section id="stscdev_tab_temporary" class="stscdev-tab-panel"></section>
      <section id="stscdev_tab_settings" class="stscdev-tab-panel"></section>
      <section id="stscdev_tab_appearance" class="stscdev-tab-panel"></section>
      <section id="stscdev_tab_updates" class="stscdev-hidden" aria-hidden="true"></section>
    </div>
  </div>
</div>

<div id="stscdev_dialog_overlay" class="stscdev-dialog-overlay stscdev-hidden" aria-hidden="true">

      <div id="stscdev_dialog_title" class="stscdev-dialog-title"></div>
      <button id="stscdev_dialog_close" class="menu_button stscdev-icon-button" type="button" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div id="stscdev_dialog_body" class="stscdev-dialog-body"></div>
    <div id="stscdev_dialog_footer" class="stscdev-dialog-footer"></div>

</div>

<!-- 悬浮面板独立挂在 body 下，不再放在 50px 的可拖动按钮容器中，避免移动端被父容器压缩成细线。 -->
<div id="stscdev_floating_panel" class="stscdev-floating-panel stscdev-hidden" role="dialog" aria-label="最新一轮自检" tabindex="-1" aria-hidden="true">
  <div class="stscdev-floating-header">
    <div>
      <div id="stscdev_floating_title" class="stscdev-floating-title">最新一轮自检</div>
      <div id="stscdev_floating_subtitle" class="stscdev-muted"></div>
    </div>
    <button id="stscdev_floating_close" class="menu_button stscdev-icon-button" type="button" aria-label="关闭悬浮窗">✕</button>
  </div>
  <div class="stscdev-floating-tabs" role="tablist" aria-label="悬浮窗功能">
    <button class="stscdev-floating-tab active" type="button" data-floating-page="check" role="tab">自检问答</button>
    <button class="stscdev-floating-tab" type="button" data-floating-page="instructions" role="tab">快捷指令</button>
    <button class="stscdev-floating-tab" type="button" data-floating-page="review" role="tab">复盘线索</button>
  </div>
  <div id="stscdev_floating_content" class="stscdev-floating-content"></div>
  <div class="stscdev-floating-footer">
    <button id="stscdev_floating_open_manager" class="menu_button" type="button">打开完整管理器</button>
  </div>
</div>
